<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kensho Pro v1.2.3</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .splash-card {
    position: relative;
    width: 496px;
    height: 296px;
    border-radius: 18px;
    background: radial-gradient(circle at 22% 18%, rgba(0, 240, 255, 0.14), transparent 52%),
                radial-gradient(circle at 82% 86%, rgba(255, 42, 75, 0.12), transparent 54%),
                linear-gradient(155deg, #0d131c 0%, #090d14 100%);
    border: 1px solid rgba(148, 163, 184, 0.22);
    box-shadow: 0 22px 48px rgba(0, 0, 0, 0.58), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px 34px 24px;
    color: #f8fafc;
    overflow: hidden;
  }
  .splash-logo-wrap {
    width: 92px;
    height: 92px;
    border-radius: 20px;
    background: rgba(15, 23, 42, 0.72);
    border: 1px solid rgba(148, 163, 184, 0.24);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42), 0 0 24px rgba(0, 240, 255, 0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 16px;
    animation: logoFloat 2.8s ease-in-out infinite;
  }
  .splash-logo {
    width: 74px;
    height: 74px;
    object-fit: contain;
    display: block;
  }
  .splash-title-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .splash-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: #f8fafc;
  }
  .splash-version {
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    padding: 3px 9px;
    border-radius: 999px;
    color: #00f0ff;
    background: rgba(0, 240, 255, 0.12);
    border: 1px solid rgba(0, 240, 255, 0.34);
  }
  .splash-sub {
    font-size: 12.5px;
    color: #94a3b8;
    letter-spacing: 0.02em;
    margin-bottom: 22px;
    text-align: center;
  }
  .splash-bar-track {
    width: 100%;
    max-width: 320px;
    height: 4px;
    border-radius: 999px;
    background: rgba(148, 163, 184, 0.16);
    overflow: hidden;
    margin-bottom: 11px;
  }
  .splash-bar-fill {
    width: 42%;
    height: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #ff2a4b 0%, #00f0ff 100%);
    animation: splashSlide 1.35s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }
  .splash-footer {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: #64748b;
    margin-top: 2px;
  }
  @keyframes splashSlide {
    0% { transform: translateX(-110%); }
    100% { transform: translateX(260%); }
  }
  @keyframes logoFloat {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-3px); }
  }
</style>
</head>
<body>
  <div class="splash-card">
    <div class="splash-logo-wrap">
      <img src="build/logo.png" alt="Kensho Pro Logo" class="splash-logo" onerror="this.onerror=null;this.src='build/icon.png';" />
    </div>
    <div class="splash-title-row">
      <div class="splash-title">Kensho Pro</div>
      <span class="splash-version" id="splash-version">v1.2.3</span>
    </div>
    <div class="splash-sub">CAD · CAM · PDF Precision Compare &amp; Engineering Studio</div>
    <div class="splash-bar-track"><div class="splash-bar-fill"></div></div>
    <div class="splash-footer">
      <span id="splash-status">Initializing native vector &amp; compare engines…</span>
      <span>Kensho Studio · Version 1.2.3</span>
    </div>
  </div>
</body>
</html>
